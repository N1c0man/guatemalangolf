<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Primary Meta -->
    <title>Guatemalan Golf | Volcano Views & Destination Golf Travel</title>
    <meta
      name="description"
      content="Discover destination golf in Guatemala. Championship courses, volcano views, Antigua day trips, and Lake Atitlán adventures."
    />

    <!-- Structured Data (Organization + WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.guatemalangolf.com/#organization",
            "name": "Guatemalan Golf",
            "url": "https://www.guatemalangolf.com",
            "logo": "https://www.guatemalangolf.com/gg_favicon_peak_512.png",
            "sameAs": ["https://www.tiktok.com/@guatemalangolf"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.guatemalangolf.com/#website",
            "url": "https://www.guatemalangolf.com",
            "name": "Guatemalan Golf",
            "publisher": {
              "@id": "https://www.guatemalangolf.com/#organization"
            }
          }
        ]
      }
    </script>

    <!-- Canonical (important for crawlers that don't run JS) -->
    <link rel="canonical" href="https://www.guatemalangolf.com" />

    <!-- Manifest (if present in /public) -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/gg_favicon_peak_32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/gg_favicon_peak_64.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/gg_favicon_peak_192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/gg_favicon_peak_512.png"
    />

    <!-- Open Graph (Facebook / WhatsApp / iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guatemalan Golf" />
    <meta
      property="og:title"
      content="Guatemalan Golf | Volcano Views & Destination Golf Travel"
    />
    <meta
      property="og:description"
      content="Discover destination golf in Guatemala. Championship courses, volcano views, Antigua day trips, and Lake Atitlán adventures."
    />
    <meta property="og:url" content="https://www.guatemalangolf.com" />
    <meta
      property="og:image"
      content="https://www.guatemalangolf.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Guatemalan Golf | Volcano Views & Destination Golf Travel"
    />
    <meta
      name="twitter:description"
      content="Discover destination golf in Guatemala. Championship courses, volcano views, Antigua day trips, and Lake Atitlán adventures."
    />
    <meta
      name="twitter:image"
      content="https://www.guatemalangolf.com/og-image.jpg"
    />
  </head>

    <div id="root"></div>
